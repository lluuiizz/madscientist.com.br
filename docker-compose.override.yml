services:
  web:
    image: nginx:alpine
    volumes:
      - ./front:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    
  api:
    build: .
    command: npm run dev
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "8080:8080"
  db:
    environment:
      POSTGRES_DB: madscientist_database
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD: dev_password
    volumes:
      - db_data_dev:/var/lib/postgresql/data
      - ./01-scheme.sql:/docker-entrypoint-initdb.d/01-scheme.sql

volumes:
  db_data_dev:


